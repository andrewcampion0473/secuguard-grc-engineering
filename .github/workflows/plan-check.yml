# Judges every proposed change before it can be merged.
#
# For each pull request, this asks Terraform what the change would do to the real AWS
# account, then tests that plan against the rules in src/secuguard_grc/plan_check.py.
# A plan that breaks a rule fails this job. A rule on the main branch then refuses the
# merge. See Part 17 of MANUAL.md.
#
# The role used here is read-only. This job can look at the account. It cannot change it.
name: Plan check

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write # lets GitHub prove to AWS which repository and pull request this is
  contents: read

jobs:
  plan-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e .
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Get short-lived, read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - name: Point Terraform at the state kept in AWS
        run: |
          cp terraform/backend.tf.example terraform/backend.tf
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=secuguard/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Check the planned change against the rules
        env:
          # The same values terraform.tfvars holds on the author's computer.
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
          TF_VAR_github_repository_id: ${{ github.repository_id }}
        run: |
          set +e
          secuguard plan-check --no-lock > plan-check.txt 2>&1
          status=$?
          cat plan-check.txt
          {
            echo '## Plan check'
            echo
            echo '```'
            cat plan-check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

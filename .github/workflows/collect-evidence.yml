# Collects evidence from the real AWS account every day, grades it, and stores it in
# the locked evidence bucket. No AWS keys are stored in GitHub. See Part 9 of MANUAL.md.
name: Collect evidence

on:
  schedule:
    - cron: "17 11 * * *" # every day at 11:17 UTC
  workflow_dispatch: # also allows a manual run from the Actions tab

permissions:
  id-token: write # lets GitHub prove to AWS which repository this is
  contents: read

jobs:
  collect:
    # Skipped until the AWS_ROLE_ARN repository variable is set.
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e .
      - name: Get short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Collect, grade, and upload evidence
        run: secuguard collect --upload --bucket "${{ vars.EVIDENCE_BUCKET }}"
      - name: Verify what was collected
        run: secuguard verify
      # Findings do not fail the job. The job fails only if collection itself breaks.
      - name: Publish the check results on this run's summary page
        run: secuguard report --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the FedRAMP 20x validation
        run: secuguard ksi --markdown >> "$GITHUB_STEP_SUMMARY"
      # The same results as a web page, attached to this run for anyone who prefers to read it in a browser.
      - name: Make the web page report
        run: secuguard report --html --out report.html
      - name: Attach the web page report to this run
        uses: actions/upload-artifact@v4
        continue-on-error: true # the evidence is already stored, so a failed attachment must not fail the run
        with:
          name: secuguard-report
          path: report.html
          retention-days: 30

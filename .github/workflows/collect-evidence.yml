# Collects evidence from the real AWS account every day and stores it in the
# locked evidence bucket. No AWS keys are stored in GitHub. See Part 9 of MANUAL.md.
name: Collect evidence

on:
  schedule:
    - cron: "17 11 * * *" # every day at 11:17 UTC
  workflow_dispatch: # also allows a manual run from the Actions tab

permissions:
  id-token: write # lets GitHub prove to AWS which repository this is
  contents: read

jobs:
  collect:
    # Skipped until the AWS_ROLE_ARN repository variable is set.
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e .
      - name: Get short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Collect and upload evidence
        run: secuguard collect --upload --bucket "${{ vars.EVIDENCE_BUCKET }}"
      - name: Verify what was collected
        run: secuguard verify

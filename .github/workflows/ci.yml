# Runs on every push. Needs no AWS account: it tests the code and runs a full
# collection against the simulated environment.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Collect evidence from the simulated environment
        run: secuguard collect --mock
      - name: Verify the evidence
        run: secuguard verify

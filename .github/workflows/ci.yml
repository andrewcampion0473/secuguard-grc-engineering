# Runs on every push. Needs no AWS account: it tests the code and runs a full
# collection, with checks, against the simulated environment.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Collect evidence from the simulated environment
        run: secuguard collect --mock
      - name: Verify the evidence
        run: secuguard verify
      - name: Publish the check results from the simulated environment
        run: secuguard report --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the FedRAMP 20x validation
        run: secuguard ksi --markdown >> "$GITHUB_STEP_SUMMARY"

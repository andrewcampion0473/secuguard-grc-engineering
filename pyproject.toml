[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secuguard-grc"
version = "0.1.0"
description = "GRC engineering demo for the fictional company SecuGuard: automated evidence collection and compliance checks on AWS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "moto[ec2,s3,kms,iam,sts]>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
secuguard = "secuguard_grc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
